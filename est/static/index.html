<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estação meteorológica</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f2f6f5;
      color: #18332d;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 950px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin-bottom: 6px;
    }

    .subtitulo,
    #atualizacao {
      color: #58716b;
    }

    .cartoes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin: 24px 0;
    }

    .cartao,
    .painel {
      padding: 18px;
      border-radius: 12px;
      background: white;
      box-shadow: 0 2px 10px #18332d12;
    }

    .rotulo {
      color: #58716b;
    }

    .valor {
      margin-top: 8px;
      font-size: 2rem;
      font-weight: bold;
    }

    canvas {
      width: 100%;
      height: 260px;
    }

    button {
      padding: 11px 16px;
      border: 0;
      border-radius: 8px;
      background: #16836b;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background: #116b57;
    }

    #erro {
      color: #a12a2a;
    }

    .mapa-link {
      color: #116b57;
    }
  </style>
</head>

<body>
  <main>
    <h1>Estação meteorológica</h1>
    <p class="subtitulo">Leituras recentes da estação ambiental.</p>

    <p id="atualizacao">Carregando dados…</p>
    <p id="erro" role="status"></p>

    <button id="botaoDemo">Adicionar leitura de demonstração</button>

    <section class="cartoes" aria-label="Leituras atuais">
      <article class="cartao">
        <div class="rotulo">Temperatura</div>
        <div class="valor" id="temperatura">—</div>
      </article>

      <article class="cartao">
        <div class="rotulo">Umidade</div>
        <div class="valor" id="umidade">—</div>
      </article>

      <article class="cartao">
        <div class="rotulo">Luminosidade (ADC)</div>
        <div class="valor" id="luminosidade">—</div>
      </article>
    </section>

    <section class="painel">
      <h2>Temperatura ao longo do tempo</h2>
      <canvas id="grafico" aria-label="Gráfico de temperatura"></canvas>
    </section>

    <p id="localizacao"></p>
  </main>

  <script>
    const formatar = (valor, casas = 1) =>
      Number(valor).toLocaleString("pt-BR", {
        minimumFractionDigits: casas,
        maximumFractionDigits: casas
      });

    async function carregarDados() {
      const erro = document.getElementById("erro");

      try {
        const resposta = await fetch("/api/readings?limit=50");

        if (!resposta.ok) {
          throw new Error("Não foi possível carregar as leituras.");
        }

        const leituras = await resposta.json();
        erro.textContent = "";

        if (leituras.length === 0) {
          document.getElementById("atualizacao").textContent =
            "Ainda não há leituras. Adicione uma leitura de demonstração.";
          document.getElementById("temperatura").textContent = "—";
          document.getElementById("umidade").textContent = "—";
          document.getElementById("luminosidade").textContent = "—";
          document.getElementById("localizacao").textContent = "";
          desenharGrafico([]);
          return;
        }

        const atual = leituras[leituras.length - 1];
        const data = new Date(atual.timestamp);

        document.getElementById("temperatura").textContent =
          `${formatar(atual.temperatura)} °C`;

        document.getElementById("umidade").textContent =
          `${formatar(atual.umidade)} %`;

        document.getElementById("luminosidade").textContent =
          atual.luminosidade;

        document.getElementById("atualizacao").textContent =
          `Estação ${atual.station_id} • Atualizado em ${data.toLocaleString("pt-BR")}`;

        const mapaUrl =
          `https://www.openstreetmap.org/?mlat=${atual.latitude}&mlon=${atual.longitude}#map=15/${atual.latitude}/${atual.longitude}`;

        document.getElementById("localizacao").innerHTML =
          `Localização: <a class="mapa-link" href="${mapaUrl}" target="_blank" rel="noopener">ver no mapa</a>`;

        desenharGrafico(leituras);
      } catch (e) {
        erro.textContent = e.message;
      }
    }

    function desenharGrafico(leituras) {
      const canvas = document.getElementById("grafico");
      const escala = window.devicePixelRatio || 1;
      const largura = canvas.clientWidth;
      const altura = canvas.clientHeight;

      canvas.width = largura * escala;
      canvas.height = altura * escala;

      const contexto = canvas.getContext("2d");
      contexto.scale(escala, escala);
      contexto.clearRect(0, 0, largura, altura);

      if (leituras.length === 0) return;

      const valores = leituras.map(leitura => Number(leitura.temperatura));
      const minimo = Math.min(...valores) - 1;
      const maximo = Math.max(...valores) + 1;
      const margem = 24;

      contexto.strokeStyle = "#16836b";
      contexto.lineWidth = 3;
      contexto.beginPath();

      valores.forEach((valor, indice) => {
        const x = margem + indice * (largura - 2 * margem) /
          Math.max(valores.length - 1, 1);

        const y = altura - margem -
          ((valor - minimo) / Math.max(maximo - minimo, 1)) *
          (altura - 2 * margem);

        if (indice === 0) contexto.moveTo(x, y);
        else contexto.lineTo(x, y);
      });

      contexto.stroke();
    }

    async function adicionarDemo() {
      const erro = document.getElementById("erro");

      try {
        const resposta = await fetch("/api/demo", { method: "POST" });

        if (!resposta.ok) {
          throw new Error("Não foi possível criar a leitura.");
        }

        await carregarDados();
      } catch (e) {
        erro.textContent = e.message;
      }
    }

    document.getElementById("botaoDemo")
      .addEventListener("click", adicionarDemo);

    carregarDados();
    setInterval(carregarDados, 10000);
    window.addEventListener("resize", carregarDados);
  </script>
</body>
</html>
